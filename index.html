<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.dropboxapi.com https://content.dropboxapi.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#2f6f5e">
<title>Memue</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 未ログイン時の画面 -->
<div id="gate" hidden>
  <div class="gate-card">
    <h1>Memue</h1>
    <p id="gateMsg">Dropbox のメモを閲覧・編集します。<br>このデバイスを Dropbox に接続してください。</p>
    <button id="loginBtn" class="primary">Dropbox に接続</button>
    <p id="gateErr" class="err"></p>
    <p class="muted">メモはこのブラウザと Dropbox の間でだけやり取りされ、他のサーバーには送られません。</p>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="side-head">
      <strong>Memue</strong>
      <button id="newBtn" class="primary">＋ 新規</button>
    </div>
    <div class="side-tools">
      <input id="q" type="search" placeholder="検索（ファイル名・本文）">
      <select id="sort" title="並び順">
        <option value="mtime-desc">更新が新しい順</option>
        <option value="mtime-asc">更新が古い順</option>
        <option value="name-desc">名前の降順</option>
        <option value="name-asc">名前の昇順</option>
      </select>
    </div>
    <ul id="list"></ul>
    <div class="side-foot">
      <span id="count" class="muted"></span>
      <button id="logoutBtn">接続を解除</button>
    </div>
  </aside>
  <div id="scrim"></div>

  <main>
    <header>
      <button id="menuBtn" title="一覧">☰</button>
      <input id="title" spellcheck="false" placeholder="ファイル名" disabled>
      <span id="status" class="muted"></span>
      <button id="modeBtn"></button>
      <button id="delBtn" title="削除" disabled>削除</button>
    </header>
    <div id="panes" hidden>
      <textarea id="ed" spellcheck="false"></textarea>
      <article id="pv" class="md"></article>
    </div>
    <div id="empty">メモを選択するか、「＋ 新規」で作成してください</div>
  </main>
</div>

<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
